<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R. 聚變核心 3D (Joint Advanced Reactor Fusion Core 3D)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- 維修長按 HUD 環 -->
  <div id="repair-hud" class="hidden">
    <svg class="progress-ring" width="80" height="80">
      <circle class="progress-ring__circle-bg" stroke="#334155" stroke-width="6" fill="transparent" r="32" cx="40" cy="40"/>
      <circle id="repair-progress-bar" class="progress-ring__circle" stroke="#00f0ff" stroke-width="6" fill="transparent" r="32" cx="40" cy="40"/>
    </svg>
    <div id="repair-label" data-i18n="repairing">正在修復線圈</div>
  </div>

  <div id="ui-layer">
    <!-- 頂部：第一壁材料狀態 + 語言切換按鈕 + 實時警報 -->
    <div id="top-bar">
      <div id="top-header-row">
        <div id="integrity-container">
          <div class="bar-header">
            <span id="label-wall-integrity" data-i18n="wallIntegrity">第一壁材料狀態</span>
            <span id="integrity-val">100.0% [Max: 100%]</span>
          </div>
          <div class="bar-bg">
            <div id="integrity-max-bar"></div>
            <div id="integrity-bar"></div>
          </div>
        </div>
        <button id="btn-lang-toggle" class="btn-lang">English</button>
      </div>
      <div id="alert-msg"></div>
    </div>

    <!-- 左側 2D 磁通量表面示波器 -->
    <div id="flux-monitor">
      <div class="monitor-title" data-i18n="poloidalFlux">極向磁通量表面 Ψ(R,Z)</div>
      <canvas id="fluxCanvas" width="160" height="200"></canvas>
      <div class="monitor-foot" id="flux-info">κ: 1.75 | Δ_Shaf: 0.08m</div>
    </div>

    <!-- 中部 HUD 數據卡片 -->
    <div id="hud">
      <div class="hud-card">
        <div class="hud-title" data-i18n="dualTemp">雙溫分離 (Te / Ti)</div>
        <div class="hud-val"><span class="temp-e" id="val-te">Te: 2.5</span> / <span class="temp-i" id="val-ti">Ti: 1.8</span> keV</div>
      </div>
      <div class="hud-card">
        <div class="hud-title" data-i18n="safetyFactor">安全因子 q₉₅ / 歸一化 β_N</div>
        <div class="hud-val" id="val-q95-beta">q: 3.50 | β: 1.2</div>
      </div>
      <div class="hud-card" id="card-q">
        <div class="hud-title" data-i18n="energyGain">聚變能量增益 Q</div>
        <div class="hud-val" id="val-q">0.00</div>
      </div>
      <div class="hud-card">
        <div class="hud-title" data-i18n="densityLimit">密度極限 n₀ / n_G</div>
        <div class="hud-val" id="val-greenwald">0.35</div>
      </div>
    </div>

    <!-- 底部控制面板 -->
    <div id="controls-panel">
      <div class="control-group">
        <label><span data-i18n="ecrhPower">微波加熱 P_ECRH (→Te)</span>: <span id="label-heat-ecrh">10.0 MW</span></label>
        <input type="range" id="slider-heat-ecrh" min="0" max="40" step="0.5" value="10">
      </div>
      <div class="control-group">
        <label><span data-i18n="nbiPower">中性束注入 P_NBI (→Ti)</span>: <span id="label-heat-nbi">10.0 MW</span></label>
        <input type="range" id="slider-heat-nbi" min="0" max="40" step="0.5" value="10">
      </div>
      <div class="control-group">
        <label><span data-i18n="toroidalField">環向磁場 B_T</span>: <span id="label-mag">6.0 T</span></label>
        <input type="range" id="slider-mag" min="2" max="15" step="0.2" value="6">
      </div>
      <div class="control-group">
        <label><span data-i18n="plasmaCurrent">等離子體電流 I_p</span>: <span id="label-ip">1.2 MA</span></label>
        <input type="range" id="slider-ip" min="0.4" max="3.0" step="0.1" value="1.2">
      </div>
      <div class="btn-row">
        <button class="btn-fuel" id="btn-fuel" data-i18n="injectFuel">注入 D-T 燃料顆粒</button>
        <button class="btn-divertor" id="btn-cool" data-i18n="divertorPurge">開啟偏濾器排熱</button>
      </div>
    </div>
  </div>

  <script src="physics.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
